<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Petdex Gallery for Pet Overlay</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="gallery-section" aria-labelledby="galleryTitle">
        <div class="gallery-heading">
          <div>
            <p id="galleryEyebrow" class="eyebrow">Gallery</p>
            <h1 id="galleryTitle">Pick a companion</h1>
          </div>
          <button id="clearTopButton" class="clear-top-button" type="button" hidden>Clear all</button>
        </div>

        <section class="control-panel" aria-label="Gallery controls">
          <div class="control-row">
            <label class="search-field">
              <span class="search-icon" aria-hidden="true"></span>
              <input id="searchInput" type="search" placeholder="Search pets, vibes, creators" autocomplete="off" aria-label="Search pets" />
              <button id="clearSearchButton" class="clear-search-button" type="button" aria-label="Clear search" hidden></button>
            </label>

            <label class="sort-field">
              <span>Sort:</span>
              <select id="sortSelect" aria-label="Sort pets">
                <option value="recent">Newest</option>
                <option value="installed">Most installed</option>
                <option value="popular">Most liked</option>
                <option value="alpha">Alphabetical</option>
              </select>
            </label>
          </div>

          <div class="mobile-filter-row">
            <button id="filtersButton" class="pill-button" type="button">Filters</button>
            <button id="clearButton" class="pill-button muted" type="button" hidden>Clear</button>
          </div>

          <div id="desktopFilters" class="desktop-filters" aria-label="Filter groups"></div>
        </section>

        <p id="statusText" class="status-text">Loading Petdex snapshot...</p>
        <section id="galleryGrid" class="gallery-grid" aria-live="polite"></section>
        <div class="load-more-wrap">
          <button id="loadMoreButton" class="load-more-button" type="button" hidden>Load more</button>
        </div>
        <p id="endText" class="end-text" hidden></p>
      </section>
    </main>

    <div id="filterSheet" class="sheet-backdrop" hidden>
      <section class="filter-sheet" role="dialog" aria-modal="true" aria-labelledby="filterSheetTitle">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-header">
          <h2 id="filterSheetTitle">Filters</h2>
          <button id="closeFiltersButton" class="icon-button" type="button" aria-label="Close filters"></button>
        </div>
        <div id="sheetFilters" class="sheet-filter-groups"></div>
      </section>
    </div>

    <template id="petCardTemplate">
      <article class="pet-card">
        <div class="card-accent" aria-hidden="true"></div>
        <div class="pet-card-top">
          <p class="dex-number"></p>
          <button class="overflow-button" type="button" aria-label="Pet actions" disabled>...</button>
        </div>

        <div class="pet-sprite-stage">
          <span class="featured-badge">FEATURED</span>
          <span class="install-count-badge"></span>
          <div class="pet-sprite-frame" role="img">
            <div class="pet-sprite"></div>
          </div>
        </div>

        <div class="pet-card-body">
          <div class="title-row">
            <h2></h2>
            <span class="featured-star" title="Featured" aria-hidden="true"></span>
            <span class="kind"></span>
          </div>
          <p class="description"></p>
          <p class="batch"></p>
          <div class="tags"></div>
          <p class="author"></p>
        </div>

        <div class="pet-card-footer">
          <div class="footer-actions">
            <button class="footer-action like-action" type="button" disabled aria-label="Likes">
              <span class="icon icon-heart" aria-hidden="true"></span>
              <span class="like-count"></span>
            </button>
            <button class="footer-action download-action" type="button" aria-label="Download ZIP">
              <span class="icon icon-download" aria-hidden="true"></span>
            </button>
            <button class="footer-action share-action" type="button" aria-label="Share pet">
              <span class="icon icon-share" aria-hidden="true"></span>
            </button>
          </div>
          <button class="install-button" type="button">Open in app</button>
        </div>
        <p class="install-hint"></p>
      </article>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
